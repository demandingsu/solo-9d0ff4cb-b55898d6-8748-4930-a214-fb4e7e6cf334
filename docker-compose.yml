services:
  quote-site-v1:
    # 报价版本 1（基线）：纯静态页面，由 nginx 提供，容器内即可离线访问
    image: nginx:1.27-alpine
    container_name: quote-site-v1
    ports:
      - "8081:80"
    volumes:
      - ./quote-site-v1:/usr/share/nginx/html:ro
      - ./quote-site-v1/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5

  quote-site-v2:
    # 报价版本 2（变更）：P001 改价、P002 下架、P003 详情改址、P005 供应商变更、P006 上架
    image: nginx:1.27-alpine
    container_name: quote-site-v2
    ports:
      - "8082:80"
    volumes:
      - ./quote-site-v2:/usr/share/nginx/html:ro
      - ./quote-site-v2/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5

  quote-site:
    # 原有比较 API 使用的报价站（保持向后兼容）
    image: nginx:1.27-alpine
    container_name: quote-site
    ports:
      - "8080:80"
    volumes:
      - ./quote-site:/usr/share/nginx/html:ro
      - ./quote-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: energy-plan-api
    ports:
      - "8000:8000"
    depends_on:
      quote-site:
        condition: service_healthy
      quote-site-v1:
        condition: service_healthy
      quote-site-v2:
        condition: service_healthy
    environment:
      # API 通过容器网络访问报价站，无需外网
      QUOTE_SITE_URL: "http://quote-site/index.html"
      # 快照 SQLite 持久化到卷，重启后保留
      SNAPSHOT_DB_PATH: "/data/quote_snapshots.sqlite3"
    volumes:
      - snapshot-data:/data

volumes:
  snapshot-data:

# 离线演示：
#   docker compose up --build
#   curl -X POST http://localhost:8000/api/v1/compare-plans \
#     -H "Content-Type: application/json" \
#     --data @demo/request.json
#
# 报价变更采集（容器内地址）：
#   版本1基线：http://quote-site-v1/index.html
#   版本2变更：http://quote-site-v2/index.html
#   curl -X POST http://localhost:8000/api/v1/quote-changes \
#     -H "Content-Type: application/json" \
#     --data @demo/quote-change-v1.json

